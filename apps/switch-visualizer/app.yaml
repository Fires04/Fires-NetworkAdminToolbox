# pyftools app manifest. Every folder under apps/ that has one of these is
# auto-discovered and mounted directly in-process at /app/<folder-name> --
# no central registry to edit, same zero-config spirit as the cli_scripts/
# tools. "app" is "module.path:attribute", the ASGI application object to
# mount (imported with this folder on sys.path).

description: "Generate switch stack VLAN port-map images from CSV exports"
app: "web.app:app"
